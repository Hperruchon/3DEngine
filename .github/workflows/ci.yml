name: CI

# The gate. CLAUDE.md, section "Method", names it as the proof. The build, the
# tests and two smoke tests run on three operating systems. The gate classes
# inside Engine.Tests run with `dotnet test`; docs/templates.md, section
# "What each gate reads", lists each one.
#
# The gate runs on three operating systems. Register entry R-0002 recorded the
# reason: each job used ubuntu-latest, a person verified the native geometry path
# on win-x64 by hand only, and the desktop host ran on Windows only.
#
# Each job sets `shell: bash`, which gives `pipefail`. Until TASK-0043 the two
# small jobs used the default shell, and a failed git command inside a pipeline
# or a command substitution gave a count of zero and a pass (codebase review of
# 2026-09-30, finding T6).

on:
  # Each push runs the gate, on each branch. A pull request is therefore not a
  # condition for a report. Before TASK-0023 this trigger named the main branch
  # only, so the gate could not report on a branch and a person had to open a
  # pull request by hand.
  #
  # A branch with an open pull request runs the gate two times. That cost is
  # accepted: the repository is public, therefore a run is free, and an automatic
  # report is worth more than a saved minute.
  push:
  pull_request:

jobs:
  gate:
    name: Gate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Each job has a time limit, so that a hang ends with a red run and not
    # after 360 minutes (TASK-0047, finding T8). A run takes about four minutes.
    timeout-minutes: 20

    strategy:
      # Each runner must report. A failure on one operating system must not hide
      # the result on the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        # One shell on three operating systems, so each script below has one
        # form. The Windows runner supplies bash.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Report the runner
        run: |
          echo "runner:  ${{ matrix.os }}"
          echo "machine: $(uname -sm)"
          dotnet --version

      - name: Build
        run: dotnet build

      # The native Manifold payload carries three runtime identifiers: linux-x64,
      # osx-arm64 and win-x64. Each runner therefore has a payload, and the tests
      # for the native backend are expected to run on each one. They skip when the
      # library does not load, because ADR-0014 section 4 makes the managed backend
      # the fallback.
      #
      # TASK-0020 first stated that the payload carries win-x64 only. That
      # statement was false. The package holds the three sets of binaries.
      #
      # When a test fails, eng/report-failed-tests.js reads the .trx result and
      # writes the name and the message of each failed test as an annotation. The
      # log of a job needs admin rights, and an annotation is public, so a person
      # with no sign-in can read which test failed (register entry R-0032,
      # TASK-0045). The step still fails with the exit code 1.
      #
      # A test that runs longer than two minutes is a hang: the slowest test
      # today has its own limit of 30 seconds. The test platform stops it and
      # writes a sequence file that names it, and the script reads that file.
      # Without the limit a hang held the runner for 360 minutes, and the step
      # never reached the script (codebase review of 2026-10-04, finding T8).
      - name: Test
        run: |
          results="$RUNNER_TEMP/test-results"
          dotnet test --no-build --logger trx --results-directory "$results" \
              --blame-hang-timeout 2m --blame-hang-dump-type none \
            || { node eng/report-failed-tests.js "$results"; exit 1; }

      - name: Smoke test the command-line host with NoOp
        run: |
          set -e
          output=$(dotnet run --no-build --project Engine.Cli -- apply NoOp --param echo=hello)
          echo "$output"
          echo "$output" | grep -q '"status": "Applied"' \
            || { echo "FAIL: status is not Applied"; exit 1; }
          echo "$output" | grep -q '"echo": "hello"' \
            || { echo "FAIL: echo output missing"; exit 1; }

      # This step is the one that register entry R-0002 asked for. It drives the
      # geometry backend through a process boundary on each operating system. On
      # the Windows runner it drives the native path.
      - name: Smoke test the geometry path with CreateBox
        run: |
          set -e
          output=$(dotnet run --no-build --project Engine.Cli -- \
            apply CreateBox --param sizeX=2 --param sizeY=3 --param sizeZ=4)
          echo "$output"
          echo "$output" | grep -q '"status": "Applied"' \
            || { echo "FAIL: CreateBox did not apply"; exit 1; }
          echo "$output" | grep -q '"bodyId"' \
            || { echo "FAIL: no body identifier in the outputs"; exit 1; }

  write-set-gate:
    timeout-minutes: 30
    name: Write set of the governing task
    # This job runs on a push and on a pull request, and it reads one commit at a
    # time. TASK-0026 made it run on each push: as a condition on a pull request it
    # reported skipped on each run, and the gate of v0.22 never ran. Since
    # TASK-0057 it also holds the contract rule, which the job
    # "Contract-touched-needs-ADR" checked on a range of commits until then. For a
    # pull request the judge reads the commits after the merge base with main;
    # the push of the branch judges each of them.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The judge comes from main, and not from the commit that it judges
      # (TASK-0053). A push to main uses the judge of the tip before the push. The
      # job fails when that tip is not known, for example after a force push, or
      # when the base holds no judge (TASK-0057, finding T28 of the codebase review
      # of 2026-10-09). Until TASK-0057 the job then ran the judge of the judged
      # commit.
      - name: Build the judge from main
        env:
          REF: ${{ github.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          judge_ref=origin/main
          if [ "$REF" = refs/heads/main ]; then
            if [ -z "$PUSH_BEFORE" ] || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              echo "::error title=Write set::the tip of main before this push, '$PUSH_BEFORE', is not known, so no judge can be built from it"
              exit 1
            fi
            judge_ref="$PUSH_BEFORE"
          fi
          git worktree add --detach "$RUNNER_TEMP/judge" "$judge_ref"
          if [ ! -f "$RUNNER_TEMP/judge/eng/write-set-check/WriteSetCheck.csproj" ]; then
            echo "::error title=Write set::$judge_ref holds no judge"
            exit 1
          fi
          echo "judge from $(git -C "$RUNNER_TEMP/judge" rev-parse HEAD)"
          dotnet build "$RUNNER_TEMP/judge/eng/write-set-check/WriteSetCheck.csproj" -c Release -o "$RUNNER_TEMP/judge-bin"

      # One commit at a time, and not the whole branch. A task governs the commit
      # that carries it (TASK-0026). On main the judge reads each commit of the
      # push. On a branch it reads each commit after the merge base with main, so
      # a green later push cannot hide a red earlier one (finding T32). The judge
      # also holds the contract rule: a commit that changes Engine.Contracts/
      # changes docs/adr/ too (finding T26). eng/write-set-check/Judge.cs holds the
      # rules and the steps.
      #
      # A judge of main from before TASK-0057 knows only --range and answers the
      # new arguments with exit code 2. The step then runs that form and gives a
      # notice, so that the branch of TASK-0057 and its merge can be judged.
      - name: Check each commit against the write set of its task
        env:
          REF: ${{ github.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # The shell of a step stops at the first failed command (bash -e), so each
          # exit code is caught with `|| status=$?` and read after the command.
          set -uo pipefail
          judge="$RUNNER_TEMP/judge-bin/write-set-check.dll"
          status=0
          if [ "$REF" = refs/heads/main ]; then
            dotnet "$judge" --range "$PUSH_BEFORE" --strict || status=$?
          else
            dotnet "$judge" --merge-base origin/main || status=$?
          fi
          if [ "$status" -eq 2 ]; then
            echo "::notice title=Write set::the judge of main knows only --range, so it judges the commits of this push"
            status=0
            dotnet "$judge" --range "$PUSH_BEFORE" || status=$?
          fi
          exit "$status"
