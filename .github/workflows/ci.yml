name: CI

# The gate. CLAUDE.md, section "Method", names it as the proof. The build, the
# tests and two smoke tests run on three operating systems. The gate classes
# inside Engine.Tests run with `dotnet test`; docs/templates.md, section
# "What each gate reads", lists each one.
#
# The gate runs on three operating systems. Register entry R-0002 recorded the
# reason: each job used ubuntu-latest, a person verified the native geometry path
# on win-x64 by hand only, and the desktop host ran on Windows only.
#
# Each job sets `shell: bash`, which gives `pipefail`. Until TASK-0043 the two
# small jobs used the default shell, and a failed git command inside a pipeline
# or a command substitution gave a count of zero and a pass (codebase review of
# 2026-09-30, finding T6).

on:
  # Each push runs the gate, on each branch. A pull request is therefore not a
  # condition for a report. Before TASK-0023 this trigger named the main branch
  # only, so the gate could not report on a branch and a person had to open a
  # pull request by hand.
  #
  # A branch with an open pull request runs the gate two times. That cost is
  # accepted: the repository is public, therefore a run is free, and an automatic
  # report is worth more than a saved minute.
  push:
  pull_request:

jobs:
  gate:
    name: Gate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Each runner must report. A failure on one operating system must not hide
      # the result on the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        # One shell on three operating systems, so each script below has one
        # form. The Windows runner supplies bash.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Report the runner
        run: |
          echo "runner:  ${{ matrix.os }}"
          echo "machine: $(uname -sm)"
          dotnet --version

      - name: Build
        run: dotnet build

      # The native Manifold payload carries three runtime identifiers: linux-x64,
      # osx-arm64 and win-x64. Each runner therefore has a payload, and the tests
      # for the native backend are expected to run on each one. They skip when the
      # library does not load, because ADR-0014 section 4 makes the managed backend
      # the fallback.
      #
      # TASK-0020 first stated that the payload carries win-x64 only. That
      # statement was false. The package holds the three sets of binaries.
      #
      # When a test fails, eng/report-failed-tests.js reads the .trx result and
      # writes the name and the message of each failed test as an annotation. The
      # log of a job needs admin rights, and an annotation is public, so a person
      # with no sign-in can read which test failed (register entry R-0032,
      # TASK-0045). The step still fails with the exit code 1.
      - name: Test
        run: |
          results="$RUNNER_TEMP/test-results"
          dotnet test --no-build --logger trx --results-directory "$results" \
            || { node eng/report-failed-tests.js "$results"; exit 1; }

      - name: Smoke test the command-line host with NoOp
        run: |
          set -e
          output=$(dotnet run --no-build --project Engine.Cli -- apply NoOp --param echo=hello)
          echo "$output"
          echo "$output" | grep -q '"status": "Applied"' \
            || { echo "FAIL: status is not Applied"; exit 1; }
          echo "$output" | grep -q '"echo": "hello"' \
            || { echo "FAIL: echo output missing"; exit 1; }

      # This step is the one that register entry R-0002 asked for. It drives the
      # geometry backend through a process boundary on each operating system. On
      # the Windows runner it drives the native path.
      - name: Smoke test the geometry path with CreateBox
        run: |
          set -e
          output=$(dotnet run --no-build --project Engine.Cli -- \
            apply CreateBox --param sizeX=2 --param sizeY=3 --param sizeZ=4)
          echo "$output"
          echo "$output" | grep -q '"status": "Applied"' \
            || { echo "FAIL: CreateBox did not apply"; exit 1; }
          echo "$output" | grep -q '"bodyId"' \
            || { echo "FAIL: no body identifier in the outputs"; exit 1; }

  contract-gate:
    name: Contract-touched-needs-ADR
    # This job compares two git trees. Its result does not depend on the
    # operating system, therefore one runner is enough.
    #
    # It runs on a push and on a pull request. Until TASK-0039 it ran on a pull
    # request only, and the owner merges into main locally, therefore the gate
    # never checked a merge into main (codebase review finding G1). On a push
    # the range starts at the previous tip; a new branch falls back to the
    # cut-off commit of the write-set gate.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check contracts vs ADRs
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -e
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            range="origin/$BASE_REF...HEAD"
          else
            cutoff=$(grep -v '^#' eng/write-set-cutoff.txt | tr -d '[:space:]')
            [ -n "$cutoff" ] || { echo "FAIL: eng/write-set-cutoff.txt gives no commit"; exit 1; }
            before="$PUSH_BEFORE"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before="$cutoff"
            elif ! git cat-file -e "$before" 2>/dev/null; then
              before="$cutoff"
            fi
            range="$before..HEAD"
          fi
          echo "range: $range"

          # Each git command is tested. A failed diff must not read as "no change".
          changed=$(git diff --name-only "$range") || { echo "FAIL: git diff on $range"; exit 1; }
          contracts_changed=$(printf '%s\n' "$changed" | grep -c '^Engine\.Contracts/' || true)
          adrs_changed=$(printf '%s\n' "$changed" | grep -c '^docs/adr/' || true)
          echo "Engine.Contracts files changed: $contracts_changed"
          echo "docs/adr files changed:         $adrs_changed"
          if [ "$contracts_changed" -gt 0 ] && [ "$adrs_changed" -eq 0 ]; then
            echo ""
            echo "FAIL: Engine.Contracts was modified but no ADR was added or updated."
            echo "Per CLAUDE.md \"Stop and ask\": a change to the public shape of"
            echo "Engine.Contracts requires an ADR in the same commit."
            exit 1
          fi

  write-set-gate:
    name: Write set of the governing task
    # This job runs on a push and on a pull request. It needs no base reference,
    # because it reads one commit at a time. TASK-0026 made that change: the job
    # was a condition on a pull request, therefore it reported skipped on each
    # run and the gate of v0.22 never ran in the pipeline.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build the tests
        run: dotnet build Engine.Tests/Engine.Tests.csproj

      # One commit at a time, and not the whole branch. A task governs the commit
      # that carries it, therefore a diff across many tasks cannot say which task
      # made which change. TASK-0026 measured that: the whole-branch diff of this
      # branch reported 19 files against the write set and each report was false.
      #
      # The commit message names the governing task: the trailer line of the form
      # TASK-nnnn, optionally followed by ' · ADR-nnnn'. A prose line that starts
      # with an identifier is not a trailer; the v0.27 message has one. TASK-0039
      # added that rule, because register entry R-0026 recorded that a commit
      # received the permits of each task file that it touched. When the message
      # names no task, the gate accepts the one task file that the commit
      # touches, and it refuses a commit that touches several and names none.
      #
      # A merge commit is checked on the changes that the merge made itself,
      # which `git diff-tree --cc` lists. A clean merge lists nothing and passes;
      # a merge with its own change needs a governing task like any commit. Until
      # TASK-0043 a merge commit gave an empty list and was never examined
      # (codebase review of 2026-09-30, finding T3).
      - name: Check each commit against the write set of its task
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -e
          cutoff=$(grep -v '^#' eng/write-set-cutoff.txt | tr -d '[:space:]')
          [ -n "$cutoff" ] || { echo "FAIL: eng/write-set-cutoff.txt gives no commit"; exit 1; }
          echo "cut-off commit: $cutoff"

          # A push gives the previous tip. A new branch gives zeros, and a pull
          # request gives no value, so both fall back to the cut-off.
          before="$PUSH_BEFORE"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="$cutoff"
          elif ! git cat-file -e "$before" 2>/dev/null; then
            before="$cutoff"
          fi
          echo "range: $before..HEAD"

          commits=$(git rev-list --reverse "$before"..HEAD) || { echo "FAIL: git rev-list on $before..HEAD"; exit 1; }
          [ -n "$commits" ] || { echo "no commit in the range"; exit 0; }

          failed=0
          for commit in $commits; do
            subject=$(git log -1 --format='%h %s' "$commit")

            if git merge-base --is-ancestor "$commit" "$cutoff" 2>/dev/null; then
              echo "skip  $subject  (grandfathered)"
              continue
            fi

            parents=$(git rev-list --parents -n 1 "$commit" | wc -w)
            if [ "$parents" -gt 2 ]; then
              files=$(git diff-tree --cc --no-commit-id --name-only -r "$commit")
              if [ -z "$files" ]; then
                echo "pass  $subject  (a merge with no change of its own)"
                continue
              fi
              echo "check $subject  (a merge with changes of its own)"
            else
              files=$(git diff-tree --no-commit-id --name-only -r "$commit")
            fi

            task=$(git log -1 --format=%B "$commit" | grep -E '^TASK-[0-9]{4}( · (ADR|TASK)-[0-9]{4})*[[:space:]]*$' | head -1 | grep -o -E '^TASK-[0-9]{4}' || true)
            echo "check $subject  (task: ${task:-none named})"

            if WRITE_SET_FILES="$files" WRITE_SET_TASK="$task" dotnet test Engine.Tests/Engine.Tests.csproj \
                 --no-build --filter 'FullyQualifiedName~WriteSetGate'; then
              echo "  pass"
            else
              echo "  FAIL $subject"
              failed=1
            fi
          done

          exit $failed
