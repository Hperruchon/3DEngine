name: Build Manifold native

# Builds the pinned Manifold C API (manifoldc) from source for each supported RID,
# serial (MANIFOLD_PAR=NONE, no TBB) per ADR-0014 §3, then packs a single multi-RID
# NuGet (runtimes/<rid>/native/) per ADR-0014 §5 / TASK-0012 §6.
#
# Since TASK-0048 a rebuild needs no manual step. A push that changes
# eng/manifold-native/manifold-ref.txt, a build script, or this file, starts the
# workflow, and the
# pin file gives the Manifold ref and the package version. The pack job pushes the
# package to the branch native-package/<version>, so a session fetches it with git
# and no sign-in. Then copy it into nuget/ and record its checksums in
# THIRD-PARTY-NOTICES.md. workflow_dispatch stays, and its inputs replace the pin.
#
# A version is immutable: when the branch of the version exists, the pack job
# pushes nothing (TASK-0049). Only a run on main pushes a package; a run on
# another branch builds and checks (finding T18 of the review of 2026-10-08). A change to a script or to this file then rebuilds
# and checks, and the package that the notices name stays as it is. A new
# package needs a new package_version in the pin file.
#
# The workflow does NOT touch the build-and-test gate in ci.yml. Publish to a feed
# stays disabled (TASK-0012 §6).

on:
  push:
    # A branch filter with no tag filter: a tag push starts no run (codebase review
    # of 2026-10-08, finding T18). Path filters are not evaluated for a tag push.
    branches: ['**']
    paths:
      - eng/manifold-native/manifold-ref.txt
      - eng/manifold-native/build.sh
      - eng/manifold-native/build.ps1
      - .github/workflows/build-manifold-native.yml
  workflow_dispatch:
    inputs:
      manifold_ref:
        description: "Manifold git ref (tag or SHA). Empty: the pin file. MUST be a double-precision release (TASK-0012 §2)."
        required: false
        default: ""
      package_version:
        description: "NuGet package version to produce. Empty: the pin file."
        required: false
        default: ""

# Each job reads only, except the pack job, which pushes the package to a branch
# (the owner accepted question Q1 of TASK-0048 on 2026-10-06). The build jobs
# compile third-party source and keep read access only.
permissions:
  contents: read

jobs:
  pin:
    name: Read the pin
    runs-on: ubuntu-latest
    outputs:
      manifold_ref: ${{ steps.pin.outputs.manifold_ref }}
      package_version: ${{ steps.pin.outputs.package_version }}
      manifold_commit: ${{ steps.pin.outputs.manifold_commit }}
    steps:
      - name: Checkout (this repo, for the pin file)
        uses: actions/checkout@v4

      - name: Read eng/manifold-native/manifold-ref.txt
        id: pin
        shell: bash
        env:
          INPUT_REF: ${{ inputs.manifold_ref }}
          INPUT_VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          file=eng/manifold-native/manifold-ref.txt
          ref=$(grep -E '^manifold_ref=' "$file" | head -1 | cut -d= -f2- | tr -d '[:space:]')
          version=$(grep -E '^package_version=' "$file" | head -1 | cut -d= -f2- | tr -d '[:space:]')
          [ -n "${INPUT_REF:-}" ] && ref="$INPUT_REF"
          [ -n "${INPUT_VERSION:-}" ] && version="$INPUT_VERSION"
          [ -n "$ref" ] && [ -n "$version" ] || { echo "FAIL: the pin file gives no manifold_ref or no package_version"; exit 1; }
          # Strict forms, because these values reach a job that can write (finding T20).
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "::error title=Native build::package_version '$version' is not a version"; exit 1; }
          [[ "$ref" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]] || { echo "::error title=Native build::manifold_ref '$ref' is not a tag, a branch or a commit"; exit 1; }
          # The exact commit of the reference. The build jobs check it out, and the
          # pack step records it in the nuspec (register entry R-0018: the package
          # of 2026-09 recorded a commit of this repository).
          if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            commit="$ref"
          else
            remote=$(git ls-remote https://github.com/elalish/manifold "refs/tags/$ref" "refs/tags/$ref^{}" "refs/heads/$ref")
            commit=$(grep -F "refs/tags/$ref^{}" <<<"$remote" | cut -f1 || true)
            [ -n "$commit" ] || commit=$(head -1 <<<"$remote" | cut -f1)
          fi
          [ -n "$commit" ] || { echo "::error title=Native build::the reference $ref names no Manifold commit"; exit 1; }
          echo "manifold_commit=$commit" >> "$GITHUB_OUTPUT"
          echo "manifold_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "package_version=$version" >> "$GITHUB_OUTPUT"
          echo "manifold_ref=$ref package_version=$version"

  build:
    name: manifoldc (${{ matrix.rid }})
    needs: pin
    strategy:
      fail-fast: false
      matrix:
        include:
          # All three RIDs are required now that macOS dylib staging is fixed. The
          # optional flag + continue-on-error below are retained (unused) so a RID can be
          # made best-effort again without reworking the job.
          - { os: windows-latest, rid: win-x64,   optional: false }
          - { os: ubuntu-latest,  rid: linux-x64, optional: false }
          - { os: macos-latest,   rid: osx-arm64, optional: false }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      # The scripts of this repository hold the recipe, and the pipeline and a
      # local build call the same ones (TASK-0049). eng/manifold-native/README.md
      # gives the local commands.
      - name: Checkout (this repo, for the build scripts)
        uses: actions/checkout@v4
        with:
          path: engine

      - name: Checkout Manifold @ ${{ needs.pin.outputs.manifold_ref }}
        uses: actions/checkout@v4
        with:
          repository: elalish/manifold
          ref: ${{ needs.pin.outputs.manifold_commit }}
          submodules: recursive
          path: manifold

      - name: Build, stage and check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./engine/eng/manifold-native/build.ps1 -Source manifold -Staging staging

      - name: Build, stage and check (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash engine/eng/manifold-native/build.sh manifold staging

      - name: Upload native-${{ matrix.rid }}
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: staging/
          if-no-files-found: error

  pack:
    name: Pack multi-RID NuGet
    needs: [pin, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The checkout keeps no token on disk; only the push step gets it (finding T19).
      - name: Checkout (this repo, for the packaging project)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Install exactly the SDK the repo pins (global.json is version-locked with
      # rollForward: disable), so `dotnet pack` from the repo root resolves it.
      - name: Set up .NET (pinned by global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dl

      - name: Lay out runtimes/<rid>/native
        shell: bash
        run: |
          set -euo pipefail
          base=eng/manifold-native
          rm -rf "$base/runtimes"
          for d in dl/native-*; do
            rid="${d##*/native-}"
            mkdir -p "$base/runtimes/$rid/native"
            cp -v "$d"/* "$base/runtimes/$rid/native/"
          done
          echo '--- package layout ---'; find "$base/runtimes" -type f

      # The SDK asks git for the commit and the branch of this repository and writes
      # them into the nuspec (register entry R-0018). With no query to git, the nuspec
      # holds only the Manifold address and commit that the step gives. A local pack
      # on 2026-10-07 showed that an empty RepositoryBranch alone does not stop it.
      - name: Pack
        shell: bash
        env:
          VERSION: ${{ needs.pin.outputs.package_version }}
          MANIFOLD_COMMIT: ${{ needs.pin.outputs.manifold_commit }}
        run: >
          dotnet pack eng/manifold-native/Engine.Geometry.Manifold.Native.csproj
          -c Release
          "-p:Version=$VERSION"
          -p:RepositoryType=git
          -p:RepositoryUrl=https://github.com/elalish/manifold
          "-p:RepositoryCommit=$MANIFOLD_COMMIT"
          -p:EnableSourceControlManagerQueries=false
          -p:PublishRepositoryUrl=true
          -o nupkg

      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: Engine.Geometry.Manifold.Native.${{ needs.pin.outputs.package_version }}
          path: nupkg/*.nupkg
          if-no-files-found: error

      # A branch with one commit that holds only the package, so that a session
      # fetches it with git and no sign-in (TASK-0048). A push with the token of
      # the workflow starts no other workflow, so ci.yml does not run on it.
      #
      # Only main publishes a package (finding T18): a run on another branch builds
      # and checks, and a push from it could claim a version for good. The token
      # reaches git through one header, for this step only (finding T19).
      - name: Push the package to native-package/<version>
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          VERSION: ${{ needs.pin.outputs.package_version }}
          SOURCE_SHA: ${{ github.sha }}
          MANIFOLD_COMMIT: ${{ needs.pin.outputs.manifold_commit }}
        run: |
          set -euo pipefail
          branch="native-package/$VERSION"
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::notice title=Native package::built and checked on $REF; only main pushes a package to $branch."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::notice title=Native package::$branch exists, and a version is immutable, so nothing is pushed. Give a new package_version in eng/manifold-native/manifold-ref.txt for a new package."
            exit 0
          fi
          mkdir out && cp nupkg/*.nupkg out/
          git checkout --orphan "$branch"
          git rm -rf --quiet .
          git clean -fdx --quiet --exclude=out
          mv out/*.nupkg . && rmdir out
          git add ./*.nupkg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "The native package $VERSION, Manifold $MANIFOLD_COMMIT, built by $SOURCE_SHA"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          echo "pushed $branch"

      # Publish is intentionally disabled until the feed is chosen (TASK-0012 §6).
      # - name: Push to feed
      #   shell: bash
      #   env:
      #     FEED_URL: ${{ vars.MANIFOLD_NUGET_FEED }}
      #     API_KEY: ${{ secrets.MANIFOLD_NUGET_API_KEY }}
      #   run: dotnet nuget push nupkg/*.nupkg --source "$FEED_URL" --api-key "$API_KEY" --skip-duplicate
