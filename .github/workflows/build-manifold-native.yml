name: Build Manifold native

# Builds the pinned Manifold C API (manifoldc) from source for each supported RID,
# serial (MANIFOLD_PAR=NONE, no TBB) per ADR-0014 §3, then packs a single multi-RID
# NuGet (runtimes/<rid>/native/) per ADR-0014 §5 / TASK-0012 §6.
#
# Since TASK-0048 a rebuild needs no manual step. A push that changes
# eng/manifold-native/manifold-ref.txt, or this file, starts the workflow, and the
# pin file gives the Manifold ref and the package version. The pack job pushes the
# package to the branch native-package/<version>, so a session fetches it with git
# and no sign-in. Then copy it into nuget/ and record its checksums in
# THIRD-PARTY-NOTICES.md. workflow_dispatch stays, and its inputs replace the pin.
#
# The workflow does NOT touch the build-and-test gate in ci.yml. Publish to a feed
# stays disabled (TASK-0012 §6).

on:
  push:
    paths:
      - eng/manifold-native/manifold-ref.txt
      - .github/workflows/build-manifold-native.yml
  workflow_dispatch:
    inputs:
      manifold_ref:
        description: "Manifold git ref (tag or SHA). Empty: the pin file. MUST be a double-precision release (TASK-0012 §2)."
        required: false
        default: ""
      package_version:
        description: "NuGet package version to produce. Empty: the pin file."
        required: false
        default: ""

# Each job reads only, except the pack job, which pushes the package to a branch
# (the owner accepted question Q1 of TASK-0048 on 2026-10-06). The build jobs
# compile third-party source and keep read access only.
permissions:
  contents: read

jobs:
  pin:
    name: Read the pin
    runs-on: ubuntu-latest
    outputs:
      manifold_ref: ${{ steps.pin.outputs.manifold_ref }}
      package_version: ${{ steps.pin.outputs.package_version }}
      manifold_commit: ${{ steps.pin.outputs.manifold_commit }}
    steps:
      - name: Checkout (this repo, for the pin file)
        uses: actions/checkout@v4

      - name: Read eng/manifold-native/manifold-ref.txt
        id: pin
        shell: bash
        env:
          INPUT_REF: ${{ inputs.manifold_ref }}
          INPUT_VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          file=eng/manifold-native/manifold-ref.txt
          ref=$(grep -E '^manifold_ref=' "$file" | head -1 | cut -d= -f2- | tr -d '[:space:]')
          version=$(grep -E '^package_version=' "$file" | head -1 | cut -d= -f2- | tr -d '[:space:]')
          [ -n "${INPUT_REF:-}" ] && ref="$INPUT_REF"
          [ -n "${INPUT_VERSION:-}" ] && version="$INPUT_VERSION"
          [ -n "$ref" ] && [ -n "$version" ] || { echo "FAIL: the pin file gives no manifold_ref or no package_version"; exit 1; }
          # The exact commit of the reference. The build jobs check it out, and the
          # pack step records it in the nuspec (register entry R-0018: the package
          # of 2026-09 recorded a commit of this repository).
          if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            commit="$ref"
          else
            remote=$(git ls-remote https://github.com/elalish/manifold "refs/tags/$ref" "refs/tags/$ref^{}" "refs/heads/$ref")
            commit=$(grep -F "refs/tags/$ref^{}" <<<"$remote" | cut -f1 || true)
            [ -n "$commit" ] || commit=$(head -1 <<<"$remote" | cut -f1)
          fi
          [ -n "$commit" ] || { echo "::error title=Native build::the reference $ref names no Manifold commit"; exit 1; }
          echo "manifold_commit=$commit" >> "$GITHUB_OUTPUT"
          echo "manifold_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "package_version=$version" >> "$GITHUB_OUTPUT"
          echo "manifold_ref=$ref package_version=$version"

  build:
    name: manifoldc (${{ matrix.rid }})
    needs: pin
    strategy:
      fail-fast: false
      matrix:
        include:
          # All three RIDs are required now that macOS dylib staging is fixed. The
          # optional flag + continue-on-error below are retained (unused) so a RID can be
          # made best-effort again without reworking the job.
          - { os: windows-latest, rid: win-x64,   optional: false }
          - { os: ubuntu-latest,  rid: linux-x64, optional: false }
          - { os: macos-latest,   rid: osx-arm64, optional: false }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      - name: Checkout Manifold @ ${{ needs.pin.outputs.manifold_ref }}
        uses: actions/checkout@v4
        with:
          repository: elalish/manifold
          ref: ${{ needs.pin.outputs.manifold_commit }}
          submodules: recursive

      # CROSS_SECTION must stay ON: MANIFOLD_CBIND is a cmake_dependent_option forced
      # OFF when cross-section is OFF (v3.5.2), which would silently drop manifoldc.
      # PAR=OFF is the serial (no-TBB) backend per ADR-0014 §3. -A x64 = VS platform.
      - name: Configure (Windows / MSVC)
        if: runner.os == 'Windows'
        shell: bash
        run: >
          cmake -B build -A x64
          -DBUILD_SHARED_LIBS=ON
          -DMANIFOLD_CROSS_SECTION=ON
          -DMANIFOLD_CBIND=ON
          -DMANIFOLD_PAR=OFF
          -DMANIFOLD_TEST=OFF
          -DMANIFOLD_DOWNLOADS=ON

      # Single-config generators need CMAKE_BUILD_TYPE at configure time.
      #
      # Each library finds its dependency in its own folder: $ORIGIN on Linux and
      # @loader_path on macOS. Without these flags libmanifoldc stored the build
      # folder of the runner as that search path, and it loaded on no other
      # computer (register entry R-0035, TASK-0048). The single quotes keep
      # $ORIGIN a literal text for CMake.
      #
      # Manifold's own CMakeLists.txt (v3.5.2, lines 255-259) sets
      # CMAKE_BUILD_WITH_INSTALL_RPATH to FALSE and CMAKE_INSTALL_RPATH to an
      # absolute folder as normal variables, which hide a flag of the same name on
      # the command line; run 37529508917 showed it. It does not set
      # CMAKE_BUILD_RPATH_USE_ORIGIN or CMAKE_BUILD_RPATH, so those two flags act:
      # each search path of the build tree becomes relative to the library, and
      # the extra entry finds the dependency in the same folder after staging.
      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          search_path='$ORIGIN'
          if [ "$RUNNER_OS" = "macOS" ]; then search_path='@loader_path'; fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DMANIFOLD_CROSS_SECTION=ON \
            -DMANIFOLD_CBIND=ON \
            -DMANIFOLD_PAR=OFF \
            -DMANIFOLD_TEST=OFF \
            -DMANIFOLD_DOWNLOADS=ON \
            -DCMAKE_BUILD_RPATH_USE_ORIGIN=ON \
            "-DCMAKE_BUILD_RPATH=$search_path"

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      # A shared build emits manifoldc + core manifold (+ Clipper2 from cross-section) — ship all.
      - name: Stage native libs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          find build -type f \( \
            -iname 'manifoldc.dll'  -o -iname 'libmanifoldc.so*' -o -iname 'libmanifoldc*.dylib' -o \
            -iname 'manifold.dll'   -o -iname 'libmanifold.so*'  -o -iname 'libmanifold*.dylib'  -o \
            -iname 'clipper2*.dll'   -o -iname 'libclipper2*.so*' -o -iname 'libclipper2*.dylib' \
          \) -exec cp -v {} staging/ \;
          echo '--- staged (raw) ---'; ls -la staging
          # The build emits versioned files; .NET loads the UNVERSIONED name (libX.so /
          # libX.dylib) and inter-lib deps use libX.so.<major> / libX.<major>.dylib. Create
          # those aliases as copies (symlinks don't survive the artifact zip). No-op on Windows.
          shopt -s nullglob
          for f in staging/*.so.*; do                      # Linux: libX.so.3.5.2
            stem="${f%.so.*}"; major="$(printf '%s' "${f#*.so.}" | cut -d. -f1)"
            cp -f "$f" "$stem.so"
            cp -f "$f" "$stem.so.$major"
          done
          for f in staging/lib*.*.dylib; do                # macOS: libX.3.5.2.dylib
            b="$(basename "$f")"; name="${b%%.*}"
            ver="${b#*.}"; ver="${ver%.dylib}"; major="$(printf '%s' "$ver" | cut -d. -f1)"
            cp -f "$f" "staging/$name.dylib"
            cp -f "$f" "staging/$name.$major.dylib"
          done
          echo '--- staged (with aliases) ---'; ls -la staging
          # Guard requires manifoldc specifically (not just the core lib) — that is the payload.
          ls staging | grep -qi 'manifoldc' || { echo 'ERROR: manifoldc not built. All shared libs under build/:'; find build -type f \( -name '*.so*' -o -name '*.dll' -o -name '*.dylib' \) -print; exit 1; }

      # The package of 2026-09 stored the build folder of the runner as the search
      # path of libmanifold in libmanifoldc, so the library loaded on no other
      # computer (register entry R-0035, TASK-0048). This step fails on that form:
      # no path of the build machine, a relative search path, and a dependency that
      # the system tool resolves inside the staging folder. Each failure is also an
      # ::error line, so that a person with no sign-in reads it in the annotations.
      - name: Check that the libraries find each other in their own folder
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          # Each tool writes into a variable first, and grep reads the variable. A
          # pipe into grep -q can close before the tool ends, and with pipefail the
          # broken pipe then reads as a failed check.
          for f in staging/*; do
            if grep -a -q -E '/(home|Users)/runner/' "$f"; then
              found=$(grep -a -o -E '/(home|Users)/runner/[^[:cntrl:]]*' "$f" || true)
              echo "::error title=Native build ($RUNNER_OS)::$f holds the path of the build machine ${found%%$'\n'*}"
              failed=1
            fi
          done
          if [ "$RUNNER_OS" = "Linux" ]; then
            dynamic=$(readelf -d staging/libmanifoldc.so)
            search=$(grep -E 'RPATH|RUNPATH' <<<"$dynamic" || true)
            echo "search path: $search"
            grep -q 'ORIGIN' <<<"$search" \
              || { echo "::error title=Native build ($RUNNER_OS)::libmanifoldc.so has no search path with \$ORIGIN: $search"; failed=1; }
            resolved=$(ldd staging/libmanifoldc.so || true)
            echo "$resolved"
            dependency=$(grep 'libmanifold.so' <<<"$resolved" || true)
            grep -q "$PWD/staging/" <<<"$dependency" \
              || { echo "::error title=Native build ($RUNNER_OS)::ldd does not resolve libmanifold inside staging/: $dependency"; failed=1; }
          else
            commands=$(otool -l staging/libmanifoldc.dylib)
            search=$(grep -A2 LC_RPATH <<<"$commands" || true)
            echo "$search"
            grep -q '@loader_path' <<<"$search" \
              || { echo "::error title=Native build ($RUNNER_OS)::libmanifoldc.dylib has no LC_RPATH with @loader_path: ${search//$'\n'/ }"; failed=1; }
            otool -L staging/libmanifoldc.dylib
          fi
          exit $failed

      - name: Upload native-${{ matrix.rid }}
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: staging/
          if-no-files-found: error

  pack:
    name: Pack multi-RID NuGet
    needs: [pin, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (this repo, for the packaging project)
        uses: actions/checkout@v4

      # Install exactly the SDK the repo pins (global.json is version-locked with
      # rollForward: disable), so `dotnet pack` from the repo root resolves it.
      - name: Set up .NET (pinned by global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dl

      - name: Lay out runtimes/<rid>/native
        shell: bash
        run: |
          set -euo pipefail
          base=eng/manifold-native
          rm -rf "$base/runtimes"
          for d in dl/native-*; do
            rid="${d##*/native-}"
            mkdir -p "$base/runtimes/$rid/native"
            cp -v "$d"/* "$base/runtimes/$rid/native/"
          done
          echo '--- package layout ---'; find "$base/runtimes" -type f

      - name: Pack
        shell: bash
        run: >
          dotnet pack eng/manifold-native/Engine.Geometry.Manifold.Native.csproj
          -c Release
          -p:Version=${{ needs.pin.outputs.package_version }}
          -p:RepositoryType=git
          -p:RepositoryUrl=https://github.com/elalish/manifold
          -p:RepositoryCommit=${{ needs.pin.outputs.manifold_commit }}
          -p:PublishRepositoryUrl=true
          -o nupkg

      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: Engine.Geometry.Manifold.Native.${{ needs.pin.outputs.package_version }}
          path: nupkg/*.nupkg
          if-no-files-found: error

      # A branch with one commit that holds only the package, so that a session
      # fetches it with git and no sign-in (TASK-0048). A push with the token of
      # the workflow starts no other workflow, so ci.yml does not run on it.
      - name: Push the package to native-package/<version>
        shell: bash
        env:
          VERSION: ${{ needs.pin.outputs.package_version }}
          SOURCE_SHA: ${{ github.sha }}
          MANIFOLD_COMMIT: ${{ needs.pin.outputs.manifold_commit }}
        run: |
          set -euo pipefail
          branch="native-package/$VERSION"
          mkdir out && cp nupkg/*.nupkg out/
          git checkout --orphan "$branch"
          git rm -rf --quiet .
          git clean -fdx --quiet --exclude=out
          mv out/*.nupkg . && rmdir out
          git add ./*.nupkg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "The native package $VERSION, Manifold $MANIFOLD_COMMIT, built by $SOURCE_SHA"
          git push --force origin "HEAD:refs/heads/$branch"
          echo "pushed $branch"

      # Publish is intentionally disabled until the feed is chosen (TASK-0012 §6).
      # - name: Push to feed
      #   shell: bash
      #   env:
      #     FEED_URL: ${{ vars.MANIFOLD_NUGET_FEED }}
      #     API_KEY: ${{ secrets.MANIFOLD_NUGET_API_KEY }}
      #   run: dotnet nuget push nupkg/*.nupkg --source "$FEED_URL" --api-key "$API_KEY" --skip-duplicate
