name: Re-run a lost runner

# ADR-0173 (TASK-0417): one automatic re-run of a run of "CI" whose only failures are jobs that GitHub gave no runner. On
# 2026-11-18 three of 44 runs failed only because the job on macOS ended with "The job was not acquired by Runner of type
# hosted even after multiple attempts"; no step ran, and a person had to start a re-run. eng/lost-runner.js makes the choice:
# a failed test, a failed step or a second attempt keeps the run red.
#
# A run with the trigger workflow_run runs this file from the default branch, with a token that can start a re-run. The job
# therefore checks out the default branch only, keeps no credentials, and runs no file of the branch of the run. The token
# reads the jobs and their annotations, and starts a re-run; it writes nothing else.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  rerun:
    name: Re-run the jobs that no runner took
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: eng/lost-runner.js
          sparse-checkout-cone-mode: false

      # The log names the run and its attempt, so a session can list a failed first attempt for the ledger.
      - name: Choose and start the re-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: node eng/lost-runner.js "$RUN_ID"
